version: '3'

services:
  back:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "9000"
    volumes:
      - ./public:/var/www/public

  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ../back/public:/var/www/public
      - ../nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - back

volumes: {}
