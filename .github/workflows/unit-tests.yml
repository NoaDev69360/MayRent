name: Tests unitaires Symfony

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Create back directory if missing
        run: mkdir -p MayRent/back
      - name: Setup .env for Symfony
        run: echo 'APP_ENV=test\nDATABASE_URL=mysql://root:root@127.0.0.1:3306/test_db' > MayRent/back/.env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: back

      - name: Run Client entity tests
        run: ./vendor/bin/phpunit tests/Entity/ClientTest.php
        working-directory: back

      - name: Run Location (réservations) entity tests
        run: ./vendor/bin/phpunit tests/Entity/LocationTest.php
        working-directory: back

      - name: Run Voiture (ajout de véhicules) entity tests
        run: ./vendor/bin/phpunit tests/Entity/VoitureTest.php
        working-directory: back
        continue-on-error: true