name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Tests Symfony (PHPUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mayrent_test
        ports: [3306:3306]
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, curl, json, xml, zip, gd
          coverage: xdebug

      - name: Setup .env for Symfony
        run: echo 'APP_ENV=test\nDATABASE_URL=mysql://root:root@127.0.0.1:3306/test_db' > MayRent/back/.env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: back

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h"127.0.0.1" -uroot -proot --silent; do
            sleep 1
          done

      - name: Set up .env.test
        run: |
          echo "APP_ENV=test" > .env.test
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/mayrent_test" >> .env.test
        working-directory: back

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
        working-directory: back

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit
        working-directory: back

  frontend:
    name: Tests React (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: front

      - name: Run tests
        run: npm test -- --watchAll=false
        working-directory: front